<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Globe Background</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:#000}

.hero{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#000}
@supports not (height:100dvh){.hero{height:100vh}}

.bg{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:max(100vw, calc(100dvh * 1.6));
  height:max(62.5vw, 100dvh);
  background-color:#000
}
@supports not (height:100dvh){
  .bg{
    width:max(100vw, calc(100vh * 1.6));
    height:max(62.5vw, 100vh)
  }
}

.bg-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:51% 8%;
  display:block;
  background-color:#000;
  pointer-events:none;
  opacity:0;
  transition:opacity .9s linear;
  filter:hue-rotate(-35deg)
}
.bg-video.is-active{opacity:1}
</style>
</head>
<body>

<div class="hero">
  <div class="bg" role="img" aria-label="Stylised globe of Earth rendered as a blue dot matrix against a starfield, slowly rotating">
    <video class="bg-video is-active" id="bgVideoA" autoplay muted loop playsinline preload="auto" disablepictureinpicture aria-hidden="true" poster="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/82e7eb75-c65f-490a-99b5-f3d1cad54200.webp">
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260912_104036_bd6924f6-3c8e-417e-8465-6d03c8c2e9e6.mp4" type="video/mp4">
    </video>
    <video class="bg-video" id="bgVideoB" muted loop playsinline preload="auto" disablepictureinpicture aria-hidden="true" poster="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/82e7eb75-c65f-490a-99b5-f3d1cad54200.webp">
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260912_104036_bd6924f6-3c8e-417e-8465-6d03c8c2e9e6.mp4" type="video/mp4">
    </video>
  </div>
</div>

<script>
(function(){
  var A=document.getElementById('bgVideoA'),B=document.getElementById('bgVideoB');
  if(!A||!B)return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){
    A.removeAttribute('autoplay'); A.pause(); B.pause();
    try{A.currentTime=0;}catch(e){}
    return;
  }
  var FADE=0.9,cur=A,nxt=B,swapping=false;
  function play(v){ try{ var p=v.play(); if(p&&p.catch)p.catch(function(){}); }catch(e){} }
  play(A);
  function tick(){
    if(swapping||!cur.duration)return;
    if(cur.duration-cur.currentTime>FADE)return;
    swapping=true; var out=cur;
    nxt.currentTime=0; play(nxt);
    nxt.classList.add('is-active'); out.classList.remove('is-active');
    cur=nxt; nxt=out;
    setTimeout(function(){ out.pause(); out.currentTime=0; swapping=false; },FADE*1000+100);
  }
  A.addEventListener('timeupdate',tick); B.addEventListener('timeupdate',tick);
})();
</script>

</body>
</html>
